<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的报名（家长）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/common.js"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">
    <div id="gate-loading" class="pt-20 text-center text-gray-400 text-sm">正在校验登录状态…</div>
    <div id="app" class="max-w-[900px] mx-auto px-4 py-6 hidden">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">👨‍👩‍👧 我的报名</h1>
            <p class="text-sm text-gray-500 mt-1">只显示用当前手机号登记的本人家庭报名；信息核对无误请点击「确认」，并按需完成活动授权（如照片使用）。机构工作人员会同步看到你的确认状态。</p>
        </div>
        <div id="list" class="space-y-4"></div>
    </div>

    <script>
        bootGate({ minPerm: "parent_portal", minPermLabel: "家长端" }).then(user => {
            $("gate-loading").classList.add("hidden");
            if (!user) return;
            $("app").classList.remove("hidden");
            load();
        });

        const STATUS_CLS = { "待确认": "bg-amber-100 text-amber-700", "已确认": "bg-green-100 text-green-700", "待补充": "bg-orange-100 text-orange-700", "异常待处理": "bg-red-100 text-red-700" };

        async function load() {
            try {
                const body = await api("/api/parent/my_enrollments");
                if (!body.data.length) {
                    $("list").innerHTML = `<div class="bg-white rounded-lg shadow p-10 text-center text-gray-400 text-sm">
                        当前手机号下暂无报名记录。报名时请使用本手机号，系统才能自动关联。</div>`;
                    return;
                }
                $("list").innerHTML = body.data.map(cardHtml).join("");
            } catch (e) { toast(e.message, false); }
        }

        function cardHtml(e) {
            const confirmed = !!e.parent_confirmed, authorized = !!e.parent_authorized;
            return `<div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-5 py-3 border-b border-gray-100 flex flex-wrap items-center gap-2">
                    <h3 class="font-bold text-gray-800">🎪 ${esc(e.activity_name || "（活动已删除）")}</h3>
                    <span class="text-xs px-2 py-0.5 rounded ${STATUS_CLS[e.status] || "bg-gray-100 text-gray-600"}">${esc(e.status)}</span>
                    ${confirmed ? '<span class="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700">✓ 已确认</span>' : '<span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-500">待确认</span>'}
                    ${authorized ? '<span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-700">已授权</span>' : ''}
                    <span class="ml-auto text-xs text-gray-400">登记于 ${esc(e.created_at || "")}</span>
                </div>
                <div class="px-5 py-4 grid md:grid-cols-2 gap-x-8 gap-y-2 text-sm">
                    <div class="flex"><span class="text-gray-400 w-24 shrink-0">孩子真名</span><span class="font-medium">${esc(e.student_real_name) || "—"}</span></div>
                    <div class="flex"><span class="text-gray-400 w-24 shrink-0">小名</span><span>${esc(e.student_nickname) || "—"}</span></div>
                    <div class="flex"><span class="text-gray-400 w-24 shrink-0">家长</span><span>${esc(e.parent_name) || "—"}（${esc(e.relation) || "—"}）</span></div>
                    <div class="flex"><span class="text-gray-400 w-24 shrink-0">手机号</span><span>${esc(e.phone) || "—"}</span></div>
                    <div class="flex md:col-span-2"><span class="text-gray-400 w-24 shrink-0">过敏原</span><span class="text-red-600">${esc(e.allergy_info) || "无"}</span></div>
                    <div class="flex md:col-span-2"><span class="text-gray-400 w-24 shrink-0">情绪触发点</span><span>${esc(e.emotion_triggers) || "无"}</span></div>
                    <div class="flex md:col-span-2"><span class="text-gray-400 w-24 shrink-0">如厕习惯</span><span>${esc(e.toilet_habits) || "无"}</span></div>
                    <div class="flex md:col-span-2"><span class="text-gray-400 w-24 shrink-0">备注</span><span>${esc(e.note) || "—"}</span></div>
                </div>
                <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex flex-wrap gap-2 items-center">
                    ${confirmed ? `<span class="text-xs text-green-600">✓ 你已确认报名信息${e.parent_confirmed_at ? "（" + esc(e.parent_confirmed_at) + "）" : ""}</span>`
                        : `<button onclick="doConfirm(${e.id},true,false)" class="px-4 py-1.5 rounded bg-green-600 text-white text-xs hover:bg-green-700">✓ 信息无误，确认报名</button>`}
                    ${authorized ? `<span class="text-xs text-blue-600">已授权活动使用（${esc(e.parent_authorized_at || "")}）</span>`
                        : `<button onclick="doConfirm(${e.id},false,true)" class="px-4 py-1.5 rounded border border-blue-500 text-blue-600 text-xs hover:bg-blue-50">授权活动使用（如照片）</button>`}
                    ${!confirmed || !authorized ? "" : ""}
                </div>
            </div>`;
        }

        async function doConfirm(id, confirmed, authorized) {
            if (authorized && !confirm("确认授权孩子在本次活动中被拍摄/记录用于活动展示吗？\n（可随时联系机构撤回；操作会留痕）")) return;
            if (confirmed && !confirm("请再次核对以上信息（孩子姓名、过敏原等）确认无误？")) return;
            try {
                const body = await api("/api/parent/confirm", { method: "POST", body: { id, confirmed, authorized } });
                toast(body.message);
                load();
            } catch (e) { toast(e.message, false); }
        }
    </script>
</body>
</html>
