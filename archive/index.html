<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>活动档案管理台</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --brand:#2f6bff; --brand-d:#1f4fd0; --brand-l:#eaf1ff;
  --ok:#12a150; --ok-l:#e6f7ed; --warn:#e08a00; --warn-l:#fff4e0;
  --danger:#d93a3a; --danger-l:#fdecec; --info:#2b8fd6; --info-l:#e6f3fc;
  --ink:#1b2330; --ink-2:#5a6675; --ink-3:#8a95a5;
  --line:#e3e8ef; --line-2:#eef1f6; --bg:#f5f7fb; --card:#fff;
  --shadow:0 1px 3px rgba(20,35,70,.06),0 6px 20px rgba(20,35,70,.05);
  --radius:12px; --radius-s:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
.topbar{
  height:58px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
  position:fixed;top:0;left:0;right:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .pen{
  width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:linear-gradient(135deg,#2f6bff,#7aa2ff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
}
.logo small{font-weight:400;color:var(--ink-3);font-size:12px}
.topbar .spacer{flex:1}
.gsearch{
  position:relative;width:280px;max-width:34vw;
}
.gsearch input{
  width:100%;height:36px;border:1px solid var(--line);border-radius:18px;
  padding:0 14px 0 34px;font-size:13px;background:var(--bg);outline:none;color:var(--ink);
}
.gsearch input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-l)}
.gsearch .ico{position:absolute;left:12px;top:8px;color:var(--ink-3);font-size:14px}
.statuslight{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);
  background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px 12px;white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-l)}
.dot.snap{background:var(--warn);box-shadow:0 0 0 3px var(--warn-l)}

/* ============ 侧栏 ============ */
.sidebar{
  position:fixed;top:58px;left:0;bottom:0;width:196px;background:var(--card);
  border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;z-index:40;
}
.nav-title{font-size:11px;color:var(--ink-3);padding:8px 10px 4px;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-s);
  color:var(--ink-2);font-size:13.5px;margin-bottom:2px;width:100%;text-align:left;transition:.14s;
}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.nav-item .ni{width:18px;text-align:center;font-size:14px;flex:0 0 18px}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;
  border-radius:9px;padding:1px 7px;font-weight:600;
}
.nav-item.active .badge{background:var(--danger)}

/* ============ 主区 ============ */
.main{margin-left:196px;padding:78px 24px 40px;min-height:100%}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;margin:0;font-weight:700}
.page-head .sub{color:var(--ink-3);font-size:13px;margin-bottom:2px}
.page-head .spacer{flex:1}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.crumb a{color:var(--ink-2)}
.crumb a:hover{color:var(--brand)}

/* ============ 卡片/通用 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:15px;font-weight:650}
.card-h .spacer{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:760px){.g4,.g2{grid-template-columns:1fr}}

/* 指标卡 */
.metric{padding:16px 18px}
.metric .lbl{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.metric .val{font-size:28px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
.metric .val small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:3px}
.metric .foot{font-size:12px;color:var(--ink-3);margin-top:4px}
.metric.warn .val{color:var(--warn)} .metric.danger .val{color:var(--danger)} .metric.ok .val{color:var(--ok)}
.metric.clickable{cursor:pointer;transition:.15s}
.metric.clickable:hover{border-color:var(--brand);transform:translateY(-1px)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--radius-s);
  font-size:13px;background:#fff;border:1px solid var(--line);color:var(--ink-2);transition:.14s;white-space:nowrap;
}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.sm{height:27px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--danger);border-color:#f3c9c9}
.btn.danger:hover{background:var(--danger-l);border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--ink-3);background:#fafbfd}
.btn:disabled:hover{background:#fafbfd}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg)}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:20px;white-space:nowrap;line-height:1.7}
.tag.gray{background:#eef1f6;color:var(--ink-2)}
.tag.blue{background:var(--brand-l);color:var(--brand-d)}
.tag.green{background:var(--ok-l);color:var(--ok)}
.tag.orange{background:var(--warn-l);color:var(--warn)}
.tag.red{background:var(--danger-l);color:var(--danger)}
.tag.cyan{background:var(--info-l);color:var(--info)}
.tag.purple{background:#f1ecfd;color:#7a4dd8}

/* 表格 */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius-s)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;padding:10px 12px;background:#f8fafc;color:var(--ink-2);font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#fafcff}
table.tbl td.mono,table.tbl th.mono{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12px;color:var(--ink-2)}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.5}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  width:100%;height:34px;border:1px solid var(--line);border-radius:var(--radius-s);
  padding:0 11px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;outline:none;
}
.field textarea{height:auto;min-height:64px;padding:8px 11px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{margin-bottom:0;min-width:132px}

/* 齐备度矩阵 */
.matrix{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:4px;font-size:12px;width:100%}
table.mx th{font-weight:600;color:var(--ink-2);padding:3px 7px;font-size:11.5px;text-align:center;white-space:nowrap}
table.mx th.rowh{text-align:left;min-width:190px;font-weight:600}
table.mx td{padding:0;text-align:center}
.cell{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;min-width:44px}
.cell.ok{background:#4cc07a} .cell.warn{background:#e8a93c} .cell.na{background:#c3cbd8}
.cell.ph{background:#7aa2ff} .cell.no{background:#eef1f6;color:var(--ink-3)}

/* 照片网格 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--card)}
.pcard .thumb{
  height:104px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;
  background:linear-gradient(135deg,#8fa9d8,#c2cfe6);position:relative;
}
.pcard.raw .thumb{background:linear-gradient(135deg,#5a6b86,#8494ae)}
.pcard.masked .thumb{background:linear-gradient(135deg,#4a9fd8,#7fc0e8)}
.pcard.public .thumb{background:linear-gradient(135deg,#3fbf7f,#7fd8a8)}
.pcard .thumb .lock{position:absolute;top:6px;right:7px;font-size:13px;opacity:.9}
.pcard .meta{padding:7px 9px}
.pcard .meta .fn{font-size:11.5px;font-family:"SF Mono",Consolas,monospace;color:var(--ink-2);word-break:break-all;line-height:1.35}
.pcard .meta .bar{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* Tab */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{
  padding:10px 16px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;
  white-space:nowrap;
}
.tab:hover{color:var(--brand-d)}
.tab.active{color:var(--brand-d);font-weight:650;border-bottom-color:var(--brand)}
.tab .cnt{font-size:11px;color:var(--ink-3);margin-left:4px}

/* 时间轴 */
.timeline{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.tl-node{flex:1;min-width:96px;text-align:center;position:relative;padding:0 4px}
.tl-node .dotline{height:3px;background:var(--line);position:relative;margin:12px 0 0}
.tl-node:first-child .dotline{border-radius:3px 0 0 3px}
.tl-node:last-child .dotline{border-radius:0 3px 3px 0}
.tl-node .tlk{font-size:11px;color:var(--ink-3);margin-top:8px;font-weight:600}
.tl-node .tld{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.tl-node.done .dotline{background:var(--ok)}
.tl-node.done .tlk{color:var(--ok)}
.tl-node.cur .dotline{background:var(--brand)}
.tl-node.cur .tlk{color:var(--brand-d)}
.tl-node.cur::after{
  content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand-l);
}

/* 检查表行 */
.chk-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2)}
.chk-row:last-child{border-bottom:none}
.chk-row .nm{width:110px;font-size:13.5px;font-weight:550;flex:0 0 110px}
.chk-row .st{flex:0 0 90px}
.chk-row .info{flex:1;font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk-row .acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,30,50,.42);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto;
}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(15,25,50,.28);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(-8px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center}
.modal-h h3{margin:0;font-size:16px;font-weight:650}
.modal-h .x{margin-left:auto;font-size:19px;color:var(--ink-3);width:30px;height:30px;border-radius:7px}
.modal-h .x:hover{background:var(--bg);color:var(--ink)}
.modal-b{padding:18px 20px;max-height:62vh;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end}

/* 提示条 */
.notice{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius-s);
  font-size:13px;background:var(--info-l);color:#1c6ba0;border:1px solid #cfe6f7;margin-bottom:14px;
}
.notice.warn{background:var(--warn-l);color:#8a5a00;border-color:#f6dfae}
.notice.ok{background:var(--ok-l);color:#0a7a3c;border-color:#bfe9d2}

/* toast */
#toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#233;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);
  animation:tin .2s ease;max-width:80vw;
}
.toast.ok{background:#0d7a3e} .toast.err{background:#c22f2f}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* 详情页 key-value */
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 14px;font-size:13.5px}
.kv .k{color:var(--ink-3);font-size:13px}
.desc{color:var(--ink-2);line-height:1.7}

.section-title{font-size:15px;font-weight:650;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.mini{font-size:12px;color:var(--ink-3)}
canvas{max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hl{background:#fff3c4;padding:0 2px;border-radius:3px}
@media print{
  .topbar,.sidebar,.toolbar,.no-print{display:none!important}
  .main{margin-left:0;padding:0}
  body{background:#fff}
  .card{box-shadow:none;border-color:#ccc}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="pen">✦</span><span>活动档案管理台<br><small>示例公益机构</small></span></div>
  <div class="spacer"></div>
  <div class="gsearch"><span class="ico">🔍</span><input id="gsearch" placeholder="搜索活动名称 / 编号 / 人员 / 手机号" autocomplete="off"></div>
  <div class="statuslight" id="statuslight" title="数据源状态"><span class="dot snap" id="statusdot"></span><span id="statustext">本地快照模式</span></div>
  <button class="btn sm" id="btn-export-quick" title="导出当前数据为 CSV">⇩ 导出 CSV</button>
</div>

<aside class="sidebar">
  <div class="nav-title">归档与查询</div>
  <button class="nav-item" data-route="overview"><span class="ni">▦</span>总览看板</button>
  <button class="nav-item" data-route="activities"><span class="ni">☰</span>活动列表</button>
  <button class="nav-item" data-route="station"><span class="ni">⚑</span>归档工作站</button>
  <button class="nav-item" data-route="todo"><span class="ni">✓</span>待办中心<span class="badge" id="nav-todo-badge" style="display:none">0</span></button>
  <div class="nav-title" style="margin-top:10px">数据与人员</div>
  <button class="nav-item" data-route="persons"><span class="ni">◍</span>人员身份库</button>
  <button class="nav-item" data-route="export"><span class="ni">⇩</span>数据导出</button>
  <div class="nav-title" style="margin-top:10px">辅助</div>
  <button class="nav-item" data-route="help"><span class="ni">?</span>使用说明</button>
</aside>

<main class="main" id="main"></main>
<div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>
<div id="toast-wrap"></div>

<script>

/* =========================================================
   活动档案管理台 · 单文件前端应用
   数据源：内置快照(CB_SNAPSHOT) + localStorage 覆盖层
   资料库模式接入点见 DBMODE 段（预留，本次走本地模式）
   ========================================================= */
"use strict";

/* ---------- 1. 常量与工具 ---------- */
var TABLES = ["activities","persons","registrations","checkins","exceptions",
              "authorizations","ledgers","photo_index","_oplog","_schema","_dict"];

var ACT_TYPES = ["融合活动","艺术疗育","家长沙龙","社区倡导"];

var REG_STATUS = ["待处理","已确认","已取消","已转现场"];
var TIERS = ["原图","处理图","精选"];
var AUTH_STATUS = ["已签","未签","已拒","待补"];
var CONFIRM_STATUS = ["待确认","已确认","存疑","已合并"];
var ARCHIVE_STATUS = ["未归档","已归档","待补"];
var EX_TYPES = ["疑似重复报名","姓名小名不一致","代报信息不全","换手机号","同名疑义","身份合并","退改","资格争议"];

/* 8 类归档资料 → 判定依据 */
var ARCHIVE_CLASSES = [
  {key:"reg_raw",   name:"原始报名记录", dir:"01_报名/", need:"registrations"},
  {key:"reg_final", name:"最终报名名单", dir:"01_报名/", need:"registrations"},
  {key:"exception", name:"异常处理记录", dir:"01_报名/", need:"exceptions", optional:true},
  {key:"checkin",   name:"签到表/出席",  dir:"02_签到/", need:"checkins"},
  {key:"ledger",    name:"活动台账",     dir:"03_台账/", need:"ledgers"},
  {key:"auth",      name:"肖像授权记录", dir:"04_授权/", need:"authorizations", optional:true},
  {key:"photo",     name:"活动照片",     dir:"05_照片/", need:"photo_index", optional:true},
  {key:"selfcheck", name:"齐备度自查表", dir:"根目录",   need:"__selfcheck"}
];

function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(id){return document.getElementById(id);}
function norm(s){ return (s==null?"":String(s)).replace(/[\s\-()（）]/g,"").trim(); }
function mobileNorm(s){ return norm(s).replace(/^\+?86/,""); }
function todayStr(d){ d=d||new Date(); var p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function nowStr(){ var d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function dateOnly(s){ return (s||"").slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function pct(a,b){ if(!b) return "0.0"; return (a/b*100).toFixed(1); }
function uniq(arr){ return Array.from(new Set(arr)); }
function countBy(arr,f){ var m={}; arr.forEach(x=>{var k=f(x); m[k]=(m[k]||0)+1;}); return m; }
function fmtDate(s){ if(!s) return "—"; return dateOnly(s); }
function weekdayOf(s){ var d=new Date(dateOnly(s)); if(isNaN(d)) return "";
  return "周"+"日一二三四五六"[d.getDay()]; }

function toast(msg,type){
  var t=document.createElement("div"); t.className="toast "+(type||"");
  t.textContent=msg; el("toast-wrap").appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .3s"; t.style.opacity="0";
    setTimeout(function(){ t.remove(); },300); },2200);
}

/* ---------- 2. 数据层 ---------- */
/* 在线版：数据由服务端统一管理（data/*.csv 持久化），多人访问共享同一份数据。
   本地改动先写内存，再异步整表推送到服务端；失败则回退 localStorage 暂存。 */
var DB = {};        // 当前生效数据（服务端 + 本地未同步改动）
var LS_KEY = "cb_archive_overrides_v3";
var OVERRIDES = {};   // {table:[rows]} 覆盖层：全量替换某表
var SYNC = { mode:"local", dirty:{}, pending:false, lastError:"" };

function loadOverrides(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    OVERRIDES = raw ? JSON.parse(raw) : {};
  }catch(e){ OVERRIDES = {}; }
  if(!OVERRIDES || typeof OVERRIDES!=="object") OVERRIDES={};
  return OVERRIDES;
}
function saveOverrides(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(OVERRIDES)); }
  catch(e){ /* 在线模式下 localStorage 仅作降级暂存，写不进也不阻断 */ }
}
function table(name){
  if(OVERRIDES && Object.prototype.hasOwnProperty.call(OVERRIDES,name)) return OVERRIDES[name];
  return (window.CB_SNAPSHOT && window.CB_SNAPSHOT[name]) ? window.CB_SNAPSHOT[name].slice() : [];
}
function setTable(name,rows){
  OVERRIDES[name]=rows;
  if(SYNC.mode==="server"){ SYNC.dirty[name]=1; queueSync(); }
  else saveOverrides();
}

/* ---- 服务端同步 ---- */
function queueSync(){
  if(SYNC.pending) return;
  SYNC.pending=true;
  setTimeout(pushSync, 260);   // 合并短时间内的多次写入
}
function pushSync(){
  var names=Object.keys(SYNC.dirty);
  if(!names.length){ SYNC.pending=false; return; }
  var payload={};
  names.forEach(function(n){ payload[n]=table(n); });
  SYNC.dirty={};
  fetch("/archive/api/data",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tables:payload})})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.error)||"保存失败");
      SYNC.lastError="";
      updateSyncBadge("已同步");
    })
    .catch(function(e){
      SYNC.lastError=e.message||String(e);
      // 推送失败 → 落 localStorage 暂存，避免丢数据
      names.forEach(function(n){ SYNC.dirty[n]=1; });
      saveOverrides();
      updateSyncBadge("同步失败（已暂存本机）");
      toast("保存到服务器失败，改动已暂存本机："+SYNC.lastError,"err");
    })
    .then(function(){ SYNC.pending=false; if(Object.keys(SYNC.dirty).length) queueSync(); });
}

/* 启动时向服务端拉取全量数据 */
function pullServer(cb){
  fetch("/archive/api/data").then(function(r){ return r.json(); })
    .then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.error)||"读取失败");
      SYNC.mode="server";
      window.CB_SNAPSHOT = j.data || {};
      // 服务端数据为准，清掉本地覆盖层（避免旧缓存盖住线上数据）
      OVERRIDES={};
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      if(cb) cb(null);
    })
    .catch(function(e){
      SYNC.mode="local";
      loadOverrides();
      if(cb) cb(e);
    });
}
function updateSyncBadge(txt){
  var st=el("statustext"), dot=el("statusdot");
  if(!st) return;
  st.textContent = txt;
  if(dot) dot.className = (txt==="已同步") ? "dot" : (SYNC.mode==="server"?"dot":"dot snap");
}

/* 数据模式：本地快照 / 服务端 / 资料库直连（预留） */
/* ==== DBMODE 接入点 ====
   平台 SDK 契约（上资料库后启用）：
     var db = window.__SMART_PAGE__.database;
     db.query({ databaseId:'<内联字面量>', pageSize:200, startCursor:cursor })
        -> { results:[], nextCursor:'', hasMore:false }   游标分页，需递归
     db.getSchema({ databaseId })  -> 字段字典
     db.addRecord({ databaseId, record:{字段:{类型:值}} })
     db.updateRecord({ databaseId, recordId, properties:{...} })
     db.deleteRecord({ databaseId, recordId })
     db.onUpdated({ databaseId }, cb)   -> 表被改动时回调
   约束：databaseId 必须内联硬编码；含 addRecord 的页面必须做 localStorage 草稿缓存。
   ===================================== */
function detectMode(){
  var sp = window.__SMART_PAGE__ && window.__SMART_PAGE__.database;
  if(sp) return "live";
  return SYNC.mode==="server" ? "server" : "snapshot";
}
function isLocal(){ return detectMode()!=="server"; }

/* ---------- 3. 内存索引 ---------- */
var IDX = {};
function buildIndex(){
  IDX = {actById:{},regByAct:{},chkByAct:{},persById:{},photosByAct:{},
         excByAct:{},authByPersonAct:{},authByAct:{},ledgerByAct:{},regByPerson:{},
         aliasMap:{},mobileMap:{}};
  table("activities").forEach(a=>{ IDX.actById[a.activity_id]=a; });
  table("persons").forEach(p=>{
    IDX.persById[p.person_id]=p;
    var names=[p.real_name,p.nickname].concat((p.alias_names||"").split("|"));
    names.forEach(n=>{ n=norm(n); if(n){ (IDX.aliasMap[n]=IDX.aliasMap[n]||[]).push(p.person_id); } });
    if(p.mobile){ var m=mobileNorm(p.mobile); (IDX.mobileMap[m]=IDX.mobileMap[m]||[]).push(p.person_id); }
  });
  table("registrations").forEach(r=>{
    (IDX.regByAct[r.activity_id]=IDX.regByAct[r.activity_id]||[]).push(r);
    (IDX.regByPerson[r.person_id]=IDX.regByPerson[r.person_id]||[]).push(r);
  });
  table("checkins").forEach(c=>{ (IDX.chkByAct[c.activity_id]=IDX.chkByAct[c.activity_id]||[]).push(c); });
  table("exceptions").forEach(e=>{ (IDX.excByAct[e.activity_id]=IDX.excByAct[e.activity_id]||[]).push(e); });
  table("authorizations").forEach(a=>{
    IDX.authByPersonAct[a.person_id+"|"+a.activity_id]=a;
    (IDX.authByAct[a.activity_id]=IDX.authByAct[a.activity_id]||[]).push(a);
  });
  table("ledgers").forEach(l=>{ IDX.ledgerByAct[l.activity_id]=l; });
  table("photo_index").forEach(p=>{ (IDX.photosByAct[p.activity_id]=IDX.photosByAct[p.activity_id]||[]).push(p); });
}
function actOf(id){ return IDX.actById[id]||{activity_id:id,title:"（活动不存在）"}; }
function personOf(id){ return IDX.persById[id]||null; }
function personName(id){ var p=personOf(id); if(!p) return id||"（未关联）";
  return p.nickname||p.real_name||p.person_id; }
function personFullName(id){ var p=personOf(id); if(!p) return id||"（未关联）";
  return p.real_name||p.nickname||p.person_id; }

/* ---------- 4. 派生计算 ---------- */
function counts(actId){
  var regs = (IDX.regByAct[actId]||[]).filter(r=>r.status!=="已取消");
  var chks = IDX.chkByAct[actId]||[];
  var walkins = chks.filter(c=>c.is_walkin==="是"||c.is_walkin===true);
  return {
    regPersonTimes: (IDX.regByAct[actId]||[]).length,
    regCount: uniq(regs.map(r=>r.person_id)).length,
    attendCount: uniq(chks.map(c=>c.person_id)).length,
    walkinCount: walkins.length,
    absentCount: Math.max(0, uniq(regs.map(r=>r.person_id)).length - uniq(chks.filter(c=>!isWalkin(c)).map(c=>c.person_id)).length),
    photoCount: (IDX.photosByAct[actId]||[]).length,
    publicPhotoCount: (IDX.photosByAct[actId]||[]).filter(p=>p.tier==="精选").length,
    authCount: (IDX.authByAct[actId]||[]).filter(a=>a.auth_status==="已签").length,
    exceptionCount: (IDX.excByAct[actId]||[]).length,
    pendingException: (IDX.excByAct[actId]||[]).filter(e=>e.status==="待处理").length
  };
}
function isWalkin(c){ return c.is_walkin==="是"||c.is_walkin===true; }

/* 8 类资料齐备度（四态：已归档/待补/不适用/占位） */
function archiveMatrix(actId){
  var c = counts(actId);
  var rows = (IDX.regByAct[actId]||[]);
  var led = IDX.ledgerByAct[actId];
  var out = {};
  out.reg_raw   = rows.length? "已归档":"待补";
  out.reg_final = rows.filter(r=>r.status==="已确认").length? "已归档":"待补";
  out.exception = c.exceptionCount? (c.pendingException? "待补":"已归档") : "不适用";
  out.checkin   = (IDX.chkByAct[actId]||[]).length? "已归档":"待补";
  out.ledger    = led? "已归档":"待补";
  out.auth      = c.authCount? "已归档":(rows.length? "待补":"不适用");
  out.photo     = c.photoCount? "已归档":"不适用";
  out.selfcheck = led && led.archive_status==="已归档" ? "已归档":"待补";
  return out;
}
function isArchived(actId){
  var m=archiveMatrix(actId);
  return Object.keys(m).every(k=>m[k]!=="待补");
}
function archiveProgress(actId){
  var m=archiveMatrix(actId), n=0, t=0;
  Object.keys(m).forEach(k=>{ if(m[k]!=="不适用"){ t++; if(m[k]==="已归档") n++; } });
  return {done:n,total:t};
}

/* 待办统计 */
function todoStats(){
  var pendingPerson = table("persons").filter(p=>p.confirm_status==="待确认"||p.confirm_status==="存疑");
  var pendingExc = table("exceptions").filter(e=>e.status==="待处理");
  var needAuth = [];
  table("photo_index").forEach(p=>{
    if(p.has_face==="是"||p.has_face===true){
      (p.person_ids||"").split("|").filter(Boolean).forEach(pid=>{
        var a = IDX.authByPersonAct[pid+"|"+p.activity_id];
        if(!a || a.auth_status!=="已签"){ needAuth.push({person_id:pid,activity_id:p.activity_id,photo_id:p.photo_id}); }
      });
    }
  });
  // 去重
  var seen={}, uniqAuth=[];
  needAuth.forEach(x=>{ var k=x.person_id+"|"+x.activity_id; if(!seen[k]){seen[k]=1;uniqAuth.push(x);} });
  return {persons:pendingPerson, exceptions:pendingExc, auth:uniqAuth,
          total:pendingPerson.length+pendingExc.length+uniqAuth.length};
}

/* 身份匹配（数据层 2.2 四档） */
function matchPerson(name,mobile){
  var n=norm(name), m=mobileNorm(mobile);
  var byName = n && IDX.aliasMap[n] ? IDX.aliasMap[n].slice() : [];
  var byMobile = m && IDX.mobileMap[m] ? IDX.mobileMap[m].slice() : [];
  var both = byName.filter(x=>byMobile.includes(x));
  if(both.length) return {grade:"A",person_id:both[0],candidates:both};
  if(byMobile.length) return {grade:"B",person_id:byMobile[0],candidates:byMobile};
  if(byName.length) return {grade:"C",person_id:byName[0],candidates:byName};
  return {grade:"D",person_id:null,candidates:[]};
}

/* ---------- 5. 写操作（本地模式 → localStorage + _oplog） ---------- */
function genId(prefix,tableName){
  var rows=table(tableName); var max=0;
  rows.forEach(r=>{ var k=r[Object.keys(r)[0]]||""; var m=k.match(/(\d+)$/); if(m) max=Math.max(max,parseInt(m[1])); });
  return prefix + String(max+1).padStart(4,"0");
}
function logOp(op){
  var rows=table("_oplog").slice();
  rows.push(Object.assign({oplog_id:"OP-L"+String(rows.length+1).padStart(4,"0"),
    op_at:nowStr(), op_by:"工作人员", op_role:"管理员"}, op));
  setTable("_oplog",rows);
}
function insertRow(tableName,row){
  var rows=table(tableName).slice(); rows.push(row); setTable(tableName,rows); buildIndex();
  return row;
}
function updateRow(tableName,pkField,pkVal,patch){
  var rows=table(tableName).slice(), hit=null;
  rows.forEach(r=>{ if(r[pkField]===pkVal){ Object.assign(r,patch); hit=r; } });
  setTable(tableName,rows); buildIndex(); return hit;
}

/* ---------- 6. 路由 ---------- */
var ROUTES = ["overview","activities","activity","station","todo","persons","export","help"];
var state = { route:"overview", param:null, tab:"overview", filters:{} };

function parseHash(){
  var h=(location.hash||"#/overview").replace(/^#\/?/,"");
  var parts=h.split("/").filter(Boolean);
  var r=parts[0]||"overview";
  if(r==="activity"){ state.route="activity"; state.param=decodeURIComponent(parts[1]||""); }
  else if(ROUTES.includes(r)){ state.route=r; state.param=null; }
  else state.route="overview";
}
function go(route,param){ location.hash = "#/"+route+(param?("/"+encodeURIComponent(param)):""); }
function refreshNav(){
  document.querySelectorAll(".nav-item[data-route]").forEach(b=>{
    var r=b.getAttribute("data-route");
    b.classList.toggle("active", r===state.route || (state.route==="activity"&&r==="activities"));
  });
  var t=todoStats();
  var bd=el("nav-todo-badge");
  if(t.total>0){ bd.style.display=""; bd.textContent=t.total; } else bd.style.display="none";
}
function render(){
  parseHash(); refreshNav();
  var m=el("main");
  if(state.route==="overview") m.innerHTML=viewOverview();
  else if(state.route==="activities") m.innerHTML=viewActivities();
  else if(state.route==="activity") m.innerHTML=viewActivityDetail(state.param);
  else if(state.route==="station") m.innerHTML=viewStation();
  else if(state.route==="todo") m.innerHTML=viewTodo();
  else if(state.route==="persons") m.innerHTML=viewPersons();
  else if(state.route==="export") m.innerHTML=viewExport();
  else if(state.route==="help") m.innerHTML=viewHelp();
  afterRender();
  window.scrollTo(0,0);
}

function metricCard(lbl,val,foot,cls,clickable,onclick){

function drawTrend(){
  var cv=el("trend-canvas"); if(!cv) return;
  var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth, hgt=230;
  cv.width=w*dpr; cv.height=hgt*dpr; cv.style.height=hgt+"px";
  var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,hgt);
  var acts=table("activities");
  var months=["01","02","03","04","05","06","07","08","09","10","11","12"];
  var reg=[], att=[];
  months.forEach(mm=>{
    var list=acts.filter(a=>dateOnly(a.start_at).slice(5,7)===mm);
    var r=0,at=0; list.forEach(a=>{ var c=counts(a.activity_id); r+=c.regCount; at+=c.attendCount; });
    reg.push(r); att.push(at);
  });
  var padL=34,padR=14,padT=16,padB=26;
  var cw=w-padL-padR, ch=hgt-padT-padB;
  var max=Math.max(4,Math.max.apply(null,reg));
  ctx.strokeStyle="#eef1f6"; ctx.fillStyle="#8a95a5"; ctx.font="11px sans-serif"; ctx.lineWidth=1;
  for(var i=0;i<=4;i++){ var y=padT+ch*i/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText(String(Math.round(max*(4-i)/4)),6,y+4); }
  function line(data,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.4; ctx.beginPath();
    data.forEach((v,i)=>{ var x=padL+cw*(i+0.5)/12, y=padT+ch-(v/max)*ch;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
    data.forEach((v,i)=>{ var x=padL+cw*(i+0.5)/12, y=padT+ch-(v/max)*ch;
      ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,3.2,0,7); ctx.fill();
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,1.3,0,7); ctx.fill(); });
  }
  line(reg,"#2f6bff"); line(att,"#4cc07a");
  ctx.fillStyle="#8a95a5"; ctx.font="11px sans-serif";
  months.forEach((mm,i)=>{ var x=padL+cw*(i+0.5)/12; ctx.fillText(parseInt(mm)+"月",x-11,hgt-8); });
}

    if(kw){ var hay=(a.title+" "+a.activity_code+" "+a.location+" "+a.host_name).toLowerCase();
      if(hay.indexOf(kw.toLowerCase())<0) return false; }
    if(type && a.act_type!==type) return false;

function timelineHTML(actId){
  var a=IM_act(actId), d0=dateOnly(a.start_at);
  var nodes=[["T-7","建活动目录"],["T-3","收授权"],["T-1","导出报名"],
             ["活动中","现场签到"],["T+1","填台账"],["T+3","归档定稿"],["T+7","复核关闭"]];
  var today=todayStr();
  var diff=daysBetween(d0,today); // today - actday
  // 判断每个节点是否已过
  function passed(off){ return daysBetween(d0,today) >= -off; }
  var h='<div class="timeline">';
  nodes.forEach(function(n,i){
    var offsets=[-7,-3,-1,0,1,3,7];
    var off=offsets[i];
    var cls="";
    var cur=false;
    // 当前所处阶段
    var prev= i===0?-999:offsets[i-1];
    if(diff>=off) cls="done";
    if(diff>=prev && diff<off) { cls="cur"; }
    h+='<div class="tl-node '+cls+'"><div class="dotline"></div><div class="tlk">'+n[0]+'</div><div class="tld">'+n[1]+'</div></div>';
  });
  h+='</div><div class="mini" style="margin-top:6px">活动日期：'+d0+' · 今日：'+today+'</div>';
  return h;
}

function findCandidates(p){
  if(!p.mobile) return null;

/* =========================================================
   14.5 批量导入报名（机构自助）
   流程：下载模板 → 上传 CSV → 匹配预览 → 确认落库
   语义：仅追加，不删改已有报名
   ========================================================= */
var BULK = null;   // 当前批量导入会话 { actId, rows:[{name,mobile,channel,by,age,remark,grade,pid,isNew,ok,err,checked}] }

/* ---- CSV 解析器（导入方向，与导出的 rowsToCSV 互为逆运算） ---- */
function parseCSV(text){
  if(text==null) return [];
  text = String(text).replace(/^\ufeff/, "");     // 去 BOM
  var rows=[], row=[], field="", inQ=false, i=0, n=text.length;
  while(i<n){
    var c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }   // "" 转义
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===","){ row.push(field); field=""; i++; continue; }
    if(c==="\r"){ i++; continue; }                            // \r\n：跳过 \r
    if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
    field+=c; i++;
  }
  if(field!==""||row.length){ row.push(field); rows.push(row); }
  // 丢弃完全空白的行
  return rows.filter(function(r){ return r.some(function(v){ return String(v).trim()!==""; }); });
}

/* ---- 第 1 步：打开导入弹窗 ---- */
function openBulkImport(actId){

    '<div class="field"><label>1. 下载模板（推荐）</label>'+

      '<div class="mini" style="margin-top:6px">模板列：报名姓名、手机号、报名渠道、代报人、报名填写年龄、备注（请勿改动表头）</div></div>'+
    '<div class="field"><label>2. 选择已整理好的 CSV 文件</label>'+

/* ---- 下载导入模板 ---- */
function downloadRegTemplate(){
  var header=["报名姓名","手机号","报名渠道","代报人","报名填写年龄","备注"];
  var sample=[
    ["（示例，可删除）示例儿童A","10000000009","小程序","","7","一行一位儿童"],
    ["（示例，可删除）李小红","10000000012","群接龙","妈妈","9",""]
  ];
  var csv=rowsToCSV(header, sample.map(function(r){
    var o={}; header.forEach(function(k,idx){ o[k]=r[idx]; }); return o;
  }));
  download("报名导入模板.csv", csv);
  toast("模板已下载，请按表头整理数据","ok");
}

/* ---- 第 2 步：读文件 → 解析 → 预览 ---- */
function handleBulkFile(input){
  var f=input.files && input.files[0];
  if(!f) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    var grid=parseCSV(text);
    if(!grid.length){ toast("文件为空或无法解析","err"); return; }
    var head=grid[0].map(function(s){ return String(s).trim(); });
    // 表头容错：允许顺序不同，但必须含关键列
    function idxOf(){
      var names=[].slice.call(arguments), out=-1;
      for(var i=0;i<names.length;i++){ var k=head.indexOf(names[i]); if(k>=0) return k; }
      return out;
    }
    var iName=idxOf("报名姓名","姓名","儿童姓名","小名");
    var iMob =idxOf("手机号","监护人手机","联系电话","电话");
    if(iName<0||iMob<0){
      toast("表头不匹配：至少需要「报名姓名」与「手机号」两列，请使用下载的模板","err");
      return;
    }
    var iChan=idxOf("报名渠道","渠道");
    var iBy  =idxOf("代报人");
    var iAge =idxOf("报名填写年龄","年龄");
    var iRem =idxOf("备注");
    var defChan=(el("bulk-channel")||{}).value||CHANNELS[0];
    var rows=[];
    for(var r=1;r<grid.length;r++){
      var g=grid[r];
      var name=String(g[iName]==null?"":g[iName]).trim();
      var mob =String(g[iMob]==null?"":g[iMob]).trim();
      if(!name && !mob) continue;
      var rec={ name:name, mobile:mob,
        channel:(iChan>=0 && String(g[iChan]||"").trim())||defChan,
        by:(iBy>=0?String(g[iBy]||"").trim():""),
        age:(iAge>=0?String(g[iAge]||"").trim():""),
        remark:(iRem>=0?String(g[iRem]||"").trim():""),
        checked:true, err:"", grade:"", pid:null, isNew:false };
      if(!name){ rec.err="缺报名姓名"; rec.checked=false; }
      else if(!mob){ rec.err="缺手机号"; rec.checked=false; }
      rows.push(rec);
    }
    if(!rows.length){ toast("未解析到有效数据行","err"); return; }
    BULK={ actId:currentBulkActId, rows:rows };
    renderBulkPreview();
  };
  reader.readAsText(f, "UTF-8");
}
var currentBulkActId=null;

/* ---- 第 3 步：渲染匹配预览 ---- */
function renderBulkPreview(){
  if(!BULK) return;
  // 重建索引，确保匹配基于最新数据
  buildIndex();
  var recs=BULK.rows;
  // 批内去重映射：同批内已出现的 手机号/姓名 → 首个人员的 pid
  var batchByMobile={}, batchByName={};
  var stat={A:0,B:0,C:0,D:0,skip:0,newPerson:0};
  recs.forEach(function(r){
    if(r.err){ r.grade=""; r.pid=null; r.isNew=false; stat.skip++; return; }
    var mn=mobileNorm(r.mobile), nn=norm(r.name);
    var mt=matchPerson(r.name, r.mobile);
    // 批内复用：同批已有该手机号/姓名 → 视为同一人，不重复建
    if(batchByMobile[mn]){ mt={grade:"D", person_id:batchByMobile[mn], candidates:[]}; }
    else if(!mt.person_id && batchByName[nn]){ mt={grade:"D", person_id:batchByName[nn], candidates:[]}; }
    r.grade=mt.grade; r.pid=mt.person_id;
    r.isNew = (mt.grade==="D");
    if(mt.grade!=="D") stat[mt.grade]++;
    else { stat.D++; }
    if(!mt.person_id){ batchByMobile[mn]=batchByMobile[mn]||("__new__"+mn); batchByName[nn]=batchByName[nn]||("__new__"+nn); }
    else { batchByMobile[mn]=mt.person_id; batchByName[nn]=mt.person_id; }
  });
  var tagColor={A:"green",B:"orange",C:"orange",D:"blue"};
  var tagText={A:"A 强匹配",B:"B 手机号命中",C:"C 姓名命中",D:"D 新人"};
  var h='<div class="section-title" style="margin-top:14px">匹配预览（共 '+recs.length+' 行）</div>'+
    '<div class="notice">A=姓名与手机号均命中；B=仅手机号命中；C=仅姓名命中；D=未命中，将新建人员（待确认）。'+
    '取消勾选可跳过该行。<b>导入为追加，不会覆盖已有报名。</b></div>'+
    '<div class="tbl-wrap" style="max-height:320px;overflow:auto;margin-top:8px"><table class="tbl"><thead><tr>'+
    '<th style="width:38px"><input type="checkbox" checked onchange="bulkToggleAll(this.checked)"></th>'+
    '<th>#</th><th>报名姓名</th><th>手机号</th><th>渠道</th><th>匹配判定</th><th>命中人员</th><th>备注</th>'+
    '</tr></thead><tbody>';
  recs.forEach(function(r,i){
    if(r.err){
      h+='<tr style="background:#fff5f5"><td></td><td>'+(i+1)+'</td><td>'+esc(r.name||"—")+'</td><td>'+esc(r.mobile||"—")+
         '</td><td>'+esc(r.channel)+'</td><td><span class="tag red">跳过</span></td><td>'+esc(r.err)+'</td><td></td></tr>';
      return;
    }
    var hit=r.pid&&!r.isNew ? esc(personFullName(r.pid))+'（'+esc(r.pid)+'）'
            : (r.isNew? '<span class="mini">将新建（待确认）</span>' : '<span class="mini">—</span>');
    h+='<tr><td><input type="checkbox" data-i="'+i+'" '+(r.checked?"checked":"")+
       ' onchange="bulkToggleRow('+i+',this.checked)"></td><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.mobile)+
       '</td><td>'+esc(r.channel)+'</td><td><span class="tag '+tagColor[r.grade]+'">'+tagText[r.grade]+'</span></td>'+
       '<td>'+hit+'</td><td class="mini">'+esc(r.remark||"")+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var checked=recs.filter(function(r){return r.checked&&!r.err;}).length;
  h+='<div class="mini" style="margin-top:10px">将导入 <b>'+checked+'</b> 条；'+
     '其中复用历史身份 '+stat.A+'+'+stat.B+'+'+stat.C+' 条，新建人员 '+stat.newPerson+' 人；跳过 '+stat.skip+' 行。</div>'+
     '<div style="margin-top:12px"><button class="btn pri" onclick="doBulkImport()">确认导入 '+checked+' 条</button></div>';
  var box=el("bulk-preview"); if(box) box.innerHTML=h;
}
function bulkToggleRow(i,on){ if(BULK&&BULK.rows[i]) BULK.rows[i].checked=on; renderBulkPreview(); }
function bulkToggleAll(on){ if(BULK) BULK.rows.forEach(function(r){ if(!r.err) r.checked=on; }); renderBulkPreview(); }

/* ---- 第 4 步：确认落库 ---- */
function doBulkImport(){
  if(!BULK) return;
  var actId=BULK.actId;
  var act=actOf(actId);
  var recs=BULK.rows.filter(function(r){ return r.checked && !r.err; });
  if(!recs.length){ toast("没有可导入的行","err"); return; }

  // 一次性落库：先收集，再 setTable，避免循环 insertRow 反复全量写盘
  var personRows=table("persons").slice();
  var regRows=table("registrations").slice();
  var excRows=table("exceptions").slice();
  var usedPid={}; personRows.forEach(function(p){ usedPid[p.person_id]=1; });
  var seqP=personRows.length, seqR=regRows.length, seqE=excRows.length;
  function nextPid(){ var id; do{ seqP++; id="P-"+String(seqP).padStart(6,"0"); }while(usedPid[id]); usedPid[id]=1; return id; }

  // 批内去重：同批同手机号/姓名共用同一新人员
  var bm={}, bn={};
  var newPersons=0, reused=0, exCount=0;
  var dateTag=dateOnly(act.start_at||todayStr()).replace(/-/g,"");

  recs.forEach(function(r){
    var mn=mobileNorm(r.mobile), nn=norm(r.name);
    var pid=null;
    if(bm[mn]) pid=bm[mn];
    else if(bn[nn]) pid=bn[nn];
    else {
      var mt=matchPerson(r.name, r.mobile);
      if(mt.grade!=="D" && mt.person_id){ pid=mt.person_id; reused++; }
      else {
        pid=nextPid();
        personRows.push({person_id:pid,person_no:"",nickname:"",real_name:r.name,alias_names:"",name_pinyin:"",
          gender:"",birth_date:"",mobile:r.mobile,guardian_name:"",guardian_relation:"",backup_mobile:"",
          diagnosis_tag:"",is_member:"否",confirm_status:"待确认",confirmed_by:"",confirmed_at:"",
          source_activity_id:actId,merged_to:"",first_seen_at:nowStr(),last_seen_at:nowStr(),
          contact_consent:"未告知",remark:"批量导入",created_at:nowStr(),updated_at:nowStr()});
        newPersons++;
      }
    }
    bm[mn]=pid; bn[nn]=pid;

    seqR++;
    var rid="R-"+dateTag+"-"+String(seqR).padStart(4,"0");
    regRows.push({registration_id:rid,activity_id:actId,person_id:pid,reg_name:r.name,
      reg_mobile:r.mobile,registered_at:nowStr(),channel:r.channel,reg_by:r.by,
      child_age_reg:r.age,pay_status:"未收费",paid_amount:"0",status:"已确认",
      raw_row_ref:"",remark:r.remark,created_at:nowStr()});

    // B/C 档生成待确认异常
    var mt2=matchPerson(r.name,r.mobile);
    if(mt2.grade==="B"||mt2.grade==="C"){
      seqE++;
      excRows.push({exception_id:"E-"+dateTag+"-"+String(seqE).padStart(4,"0"),activity_id:actId,person_id:pid,
        ex_type:mt2.grade==="B"?"姓名小名不一致":"换手机号",
        ex_desc:"批量导入填「"+r.name+"/"+r.mobile+"」，历史档案疑似同一人，待人工确认",
        related_reg_id:rid,resolution:"待确认",resolved_by:"",resolved_at:"",status:"待处理",
        evidence_ref:"",created_at:nowStr()});
      exCount++;
    }
  });

  setTable("persons",personRows);
  setTable("registrations",regRows);
  if(exCount) setTable("exceptions",excRows);
  buildIndex();
  logOp({op_type:"批量导入",target_table:"registrations",target_pk:actId,field_changed:"registration_id",
    old_value:"",new_value:recs.length+"条",reason:"批量导入报名 "+recs.length+" 条（新增人员"+newPersons+"，复用"+reused+"）"});

  closeModal();
  var msg="已导入 "+recs.length+" 条";
  if(newPersons) msg+="，新增人员 "+newPersons+" 人（待确认）";
  if(reused) msg+="，复用历史身份 "+reused+" 人";
  if(exCount) msg+="，待确认异常 "+exCount+" 条";
  toast(msg,"ok");
  BULK=null;
  render();
}

/* ---------- 21. 导出：CSV ---------- */
function csvCell(v){
  if(v==null) return "";
  var s=String(v);
  if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function rowsToCSV(header,rows){
  var out=[header.map(csvCell).join(",")];
  rows.forEach(r=>{ out.push(header.map(h=>csvCell(r[h])).join(",")); });
  return "\ufeff"+out.join("\r\n");
}
function download(filename,content,mime){
  var blob=new Blob([content],{type:mime||"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
}
function tableToCSV(name){
  var rows=table(name);
  if(!rows.length) return rowsToCSV([],[]);
  var header=Object.keys(rows[0]);
  // 汇总所有键，防止空字段缺失
  var keySet={}; rows.forEach(r=>Object.keys(r).forEach(k=>keySet[k]=1));
  header=Object.keys(keySet);
  return rowsToCSV(header,rows);
}
function exportTableCSV(name){
  download(name.replace(/^_/,"")+".csv",tableToCSV(name));
  logOp({op_type:"导出",target_table:name,target_pk:"ALL",field_changed:"",old_value:"",new_value:table(name).length+" 行",reason:"导出单表 CSV"});

/* ---------- 22. 导出：XLSX（纯 JS，无第三方库） ---------- */
/* 生成标准 xlsx（zip store 模式，仅需 CRC32） */
function crc32(bytes){
  var table=crc32.table;
  if(!table){ table=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?(0xEDB88320^(c>>>1)):(c>>>1); table[n]=c>>>0; } crc32.table=table; }
  var crc=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc=(crc>>>8)^table[(crc^bytes[i])&0xFF]; }
  return (crc^0xFFFFFFFF)>>>0;
}
function strToU8(s){ return new TextEncoder().encode(s); }
function u8concat(arrs){ var len=0; arrs.forEach(a=>len+=a.length); var out=new Uint8Array(len),p=0;
  arrs.forEach(a=>{ out.set(a,p); p+=a.length; }); return out; }
function makeZip(files){ // files: [{name, data:Uint8Array}]
  var chunks=[], central=[], offset=0;
  function num(n,bytes){ var a=new Uint8Array(bytes); for(var i=0;i<bytes;i++) a[i]=(n>>>(8*i))&0xFF; return a; }
  files.forEach(function(f){
    var nameBytes=strToU8(f.name), data=f.data, crc=crc32(data);
    var local=u8concat([num(0x04034b50,4),num(20,2),num(0,2),num(0,2),num(0,2),num(0,2),
      num(crc,4),num(data.length,4),num(data.length,4),num(nameBytes.length,2),num(0,2),nameBytes,data]);
    chunks.push(local);
    central.push(u8concat([num(0x02014b50,4),num(20,2),num(20,2),num(0,2),num(0,2),num(0,2),num(0,2),
      num(crc,4),num(data.length,4),num(data.length,4),num(nameBytes.length,2),num(0,2),num(0,2),num(0,2),
      num(0,2),num(0,4),num(offset,4),nameBytes]));
    offset+=local.length;
  });
  var centralBytes=u8concat(central);
  var end=u8concat([num(0x06054b50,4),num(0,2),num(0,2),num(files.length,2),num(files.length,2),
    num(centralBytes.length,4),num(offset,4),num(0,2)]);
  return u8concat(chunks.concat([centralBytes,end]));
}
function xmlEsc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]; }); }
function colName(n){ var s=""; n++; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function sheetXml(header,rows){
  var all=[header].concat(rows.map(r=>header.map(h=>r[h])));
  var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  all.forEach(function(row,ri){
    xml+='<row r="'+(ri+1)+'">';
    row.forEach(function(v,ci){
      var ref=colName(ci)+(ri+1);
      var isNum=(v!=null&&v!==""&&!isNaN(v)&&String(v).trim()!=="");
      if(isNum) xml+='<c r="'+ref+'" t="n"><v>'+esc2(v)+'</v></c>';
      else xml+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    });
    xml+='</row>';
  });
  xml+='</sheetData></worksheet>';
  return xml;
}
function esc2(v){ return String(v); }
function buildXLSX(sheets){ // sheets:[{name,header,rows}]
  var files=[];
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
    '</Types>';
  files.push({name:"[Content_Types].xml",data:strToU8(ct)});
  files.push({name:"_rels/.rels",data:strToU8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    sheets.map((s,i)=>'<sheet name="'+xmlEsc(s.name.slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+
    '</sheets></workbook>';
  files.push({name:"xl/workbook.xml",data:strToU8(wb)});
  files.push({name:"xl/_rels/workbook.xml.rels",data:strToU8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+
    '</Relationships>')});
  sheets.forEach((s,i)=>{ files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:strToU8(sheetXml(s.header,s.rows))}); });
  var zip=makeZip(files);
  var blob=new Blob([zip],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download=sheets.filename||"export.xlsx";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
}

/* 脱敏函数（数据层 4.3） */
function maskMobile(v){ if(!v) return ""; var s=String(v); return s.length>=7? s.slice(0,3)+"****"+s.slice(-4):"***"; }
function ageBand(birth){ if(!birth) return ""; var y=parseInt(dateOnly(birth).slice(0,4)); if(!y) return "";
  var age=new Date().getFullYear()-y; var lo=Math.floor(age/2)*2; return lo+"-"+(lo+2)+" 岁"; }
function desensitizeRows(tableName,rows){
  return rows.map(function(r){
    var o=Object.assign({},r);
    delete o.diagnosis_tag; delete o.remark; delete o.backup_mobile;
    if(o.mobile!=null) o.mobile=maskMobile(o.mobile);
    if(o.reg_mobile!=null) o.reg_mobile=maskMobile(o.reg_mobile);
    if(o.birth_date!=null) o.birth_date=ageBand(o.birth_date);
    if(o.guardian_name!=null) o.guardian_name="";
    return o;
  });
}
function cols(rows){ if(!rows.length) return []; var s={}; rows.forEach(r=>Object.keys(r).forEach(k=>s[k]=1)); return Object.keys(s); }
function sheetOf(name,rows){ return {name:name,header:cols(rows),rows:rows}; }

function doExportInternalXLSX(actId,fmt,desens){
  var a=actOf(actId);
  var names=uniq((IDX.regByAct[actId]||[]).map(r=>r.person_id).concat((IDX.chkByAct[actId]||[]).map(c=>c.person_id)));
  var sheets=[
    sheetOf("活动",[a]),
    sheetOf("报名",IDX.regByAct[actId]||[]),
    sheetOf("签到",IDX.chkByAct[actId]||[]),
    sheetOf("异常",IDX.excByAct[actId]||[]),
    sheetOf("授权",IDX.authByAct[actId]||[]),
    sheetOf("台账",IDX.ledgerByAct[actId]?[IDX.ledgerByAct[actId]]:[]),
    sheetOf("照片索引",IDX.photosByAct[actId]||[]),
    sheetOf("人员",names.map(personOf).filter(Boolean))
  ];
  if(desens) sheets=sheets.map(s=>Object.assign({},s,{rows:desensitizeRows(s.name,s.rows)}));
  var fname=(desens?"备案_":"留档_")+a.activity_code+"_v1_"+todayStr().replace(/-/g,"")+".xlsx";
  sheets.filename=fname;
  buildXLSX(sheets);
  logOp({op_type:"导出",target_table:"ALL",target_pk:actId,field_changed:"",old_value:"",
    new_value:(desens?"脱敏 ":"全量 ")+"8 Sheet XLSX",reason:(desens?"基金会备案":"内部留档")+"导出："+a.title});
  toast("已导出 "+fname,"ok");
}
function exportActivityArchive(actId,fmt){
  if(fmt==="xlsx") doExportInternalXLSX(actId,fmt,false);
  else exportActivityCSV(actId);
}
function exportFiling(actId,fmt){
  if(fmt==="xlsx") doExportInternalXLSX(actId,fmt,true);
  else {
    var a=actOf(actId);
    var sets=[["备案_报名",IDX.regByAct[actId]||[]],["备案_签到",IDX.chkByAct[actId]||[]],
      ["备案_台账",IDX.ledgerByAct[actId]?[IDX.ledgerByAct[actId]]:[]],["备案_授权",IDX.authByAct[actId]||[]]];
    sets.forEach((s,i)=>{ setTimeout(function(){ download(s[0]+".csv",tableToCSV2(desensitizeRows(s[0],s[1]))); },i*180); });
    logOp({op_type:"导出",target_table:"ALL",target_pk:actId,field_changed:"",old_value:"",new_value:"脱敏 4 表 CSV",reason:"基金会备案导出："+a.title});
    toast("正在导出备案数据源（已脱敏）…","ok");
  }
}
function exportYear(){
  var y="2026";
  var acts=table("activities").filter(a=>dateOnly(a.start_at).slice(0,4)===y);
  var summary=acts.map(a=>{ var c=counts(a.activity_id), led=IDX.ledgerByAct[a.activity_id];
    return {活动编号:a.activity_id,活动名称:a.title,类型:a.act_type,日期:fmtDate(a.start_at),地点:a.location,
      负责人:a.host_name,报名去重:c.regCount,报名人次:c.regPersonTimes,实际出席:c.attendCount,
      现场补录:c.walkinCount,出席率:(led?led.attend_rate:pct(c.attendCount,c.regCount))+"%",
      照片数:c.photoCount,授权覆盖:c.authCount,归档状态:led?led.archive_status:"未归档"}; });
  var persons=desensitizeRows("persons",table("persons")).map(p=>({人员ID:p.person_id,会员号:p.person_no||"",

    确认状态:p.confirm_status||"",首次登记:p.first_seen_at||"",最近出现:p.last_seen_at||""}));
  var sheets=[ {name:"年度活动汇总",header:cols(summary),rows:summary},

  sheets.filename="年检_"+y+"年度_v1_"+todayStr().replace(/-/g,"")+".xlsx";

  logOp({op_type:"导出",target_table:"ALL",target_pk:y,field_changed:"",old_value:"",new_value:"年检 2 Sheet XLSX",reason:"年检导出："+y+" 年度"});
  toast("已导出年检包（人员已脱敏）","ok");
}

/* ---------- 23. 启动 ---------- */
function boot(){
  try{
    /* 1) 绑定 UI 事件（先绑定，拉数据期间界面即可交互） */
    document.querySelectorAll(".nav-item[data-route]").forEach(function(b){
      b.addEventListener("click", function(){ go(b.getAttribute("data-route")); });
    });

    /* 2) 品牌区点击回总览 */
    var brand=document.querySelector(".brand");
    if(brand) brand.addEventListener("click", function(){ go("overview"); });

    /* 3) hash 变化触发渲染 */
    window.addEventListener("hashchange", function(){ render(); });
    if(!location.hash) location.hash="#/overview";

    /* 4) 键盘 ESC 关闭弹窗 */
    document.addEventListener("keydown", function(e){
      if(e.key==="Escape") closeModal();
    });

    /* 5) 弹窗遮罩点击关闭 */
    var mask=el("modal-mask");
    if(mask) mask.addEventListener("click", function(e){ if(e.target===mask) closeModal(); });

    /* 6) 先渲染内置快照（立即可见），再向服务端拉取最新数据后重渲染 */
    loadOverrides();
    buildIndex();
    render();

    pullServer(function(err){
      if(err){ toast("未能连接服务器，已切换到离线模式（改动仅存本机）","err"); }
      else { loadOverrides(); }
      buildIndex();
      render();
    });
  }catch(err){
    window.__BOOTERR__ = err && err.message ? err.message : String(err);
    var m=el("main");
    if(m) m.innerHTML='<div class="card" style="margin:24px"><h3 style="color:#c0392b">初始化失败</h3>'+
      '<p class="mini">'+esc(window.__BOOTERR__)+'</p>'+
      '<p class="mini">请刷新页面重试；若仍失败，请清除本页本地存储（localStorage）后重载。</p></div>';
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
